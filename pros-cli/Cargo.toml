[package]
name = "pros-cli"
version = "0.1.0"
description = "The command line over the target library"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pros"
path = "src/main.rs"

# The logic is in the library crates; this shim holds argument parsing and the wording of
# what a person reads.
[dependencies]
pros-core = { workspace = true }
pros-link = { workspace = true }
# The Moonlight host bridge and its fake target, for the `moonlight` and `fake-target` verbs.
# Its protocol dependencies stay in that crate.
pros-moonlight = { workspace = true }

# Logging, so `pros` and the window are turned up the same way.
oops-log = { workspace = true }

# Argument parsing and the generated help text for every subcommand.
clap = { version = "4", features = ["derive"] }

# The integration tests drive the built binary against the fake target from `pros-link`.
[dev-dependencies]
pros-link = { workspace = true }

[lints]
workspace = true

# Only a Windows executable carries an icon. Target-gated so other platforms never fetch or
# build it.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
