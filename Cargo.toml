[workspace]
resolver = "3"
members = ["crates/pros-core", "crates/pros-link", "crates/pros-moonlight", "pros-cli", "pros-gui"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/project-oops/Prosperous"
rust-version = "1.85"
publish = false

[workspace.dependencies]

# Embeds the executable icon on Windows, across the MSVC and GNU toolchains.
winresource = "0.1"
pros-link = { path = "crates/pros-link" }
pros-core = { path = "crates/pros-core" }
pros-moonlight = { path = "crates/pros-moonlight" }

# Shared with the rest of the collection, by path while nothing is published.
oops-build = { path = "../oops-libs/crates/oops-build" }
oops-log = { path = "../oops-libs/crates/oops-log" }
# The in-app documentation reader; only the window takes it, as it pulls egui.
oops-docs = { path = "../oops-libs/crates/oops-docs" }
# The facade, for the macros; `oops-log` sets up the subscriber. `attributes` is off because
# nothing here uses `#[instrument]` and it pulls a proc-macro chain.
tracing = { version = "0.1", default-features = false, features = ["std"] }
oops-paths = { path = "../oops-libs/crates/oops-paths" }

# The `param.sfo` reader. Platform formats belong to SELFish (D028).
selfish-title = { path = "../selfish/crates/selfish-title" }
# The container magic that tells a SELF from an ELF; zero-dependency.
selfish-abi = { path = "../selfish/crates/selfish-abi" }

# The window. Same version and wgpu backend as orbistoun's shell, so a shared GUI crate stays
# a move rather than a port (D009).
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    # winit takes its Linux backends from features, and `default-features = false` drops both.
    "x11",
    "wayland",
] }
egui = "0.29"

# `unsafe_code` is forbidden: this is a network client and has no use for it.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
