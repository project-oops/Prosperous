[package]
name = "pros-gui"
version = "0.1.0"
description = "The window over the target library"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pros-gui"
path = "src/main.rs"

# This crate holds no logic: it reads state and draws it, and every decision it presents is
# made in a crate below it and is reachable from `pros` too.
[dependencies]
pros-core = { workspace = true }
pros-link = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# The system file dialog, for running a file that is not in a folder this program manages.
# Its transitive packages (`log`, `raw-window-handle`, `windows-sys`) are already in the window
# library's tree. Default features are off because they pull in GTK on Linux; the portal
# covers a modern desktop.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Regular expressions for the log filter. `regex-lite` rather than `regex`: the full engine
# adds `aho-corasick`, `memchr` and two `regex-*` crates for throughput a filter over a few
# thousand short lines does not need, and `regex-lite` has no dependencies of its own and the
# same `Regex::new` / `is_match` surface.
regex-lite = "0.1"

oops-log = { workspace = true }
oops-docs = { workspace = true }

[lints]
workspace = true

# Embeds the icon Explorer and the taskbar show. Windows only: an executable elsewhere has
# nowhere to put one.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
