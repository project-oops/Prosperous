name: check

# Every job checks out the collection, checks this repository out into it, and asks
# `oops bootstrap` for the siblings this project needs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: build, lint and test
    runs-on: ubuntu-latest
    steps:
      # The collection without submodules; `bootstrap` fetches only the siblings needed.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS

      # Inside the OOPS layout, because oops-libs and selfish are resolved by relative path.
      # A full clone, so the provenance step always has a repository to ask.
      - uses: actions/checkout@v4
        with:
          path: OOPS/prosperous
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap prosperous
        env:
          # Empty unless the org secret exists.
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      # The same gate a person runs: `./bin/prosperous check`.
      - name: oops check prosperous
        run: OOPS/bin/oops check prosperous
