name: Deploy landing page to GitHub Pages

# Publishes frontend/web/ and the rendered docs/ to Pages on every push to main.
# `configure-pages` enables Pages itself, so no manual Settings step is needed.

on:
  push:
    branches: [main]
    paths:
      - "frontend/web/**"
      - "docs/**"
      - "assets/logo.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site bundle
    # Pages does not serve a private repository on a free plan.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      # The standard OOPS preamble: the collection, this repository inside it, then the
      # siblings this project needs.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/prosperous

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap prosperous
        env:
          # Empty unless the org secret exists.
          OOPS_CI_TOKEN: ${{ secrets.OOPS_CI_TOKEN }}

      - name: Assemble bundle
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp -r frontend/web/. site/
          cp assets/logo.svg site/assets/
          bash ../tools/build-docs.sh . site "#4da6ff" "Prosperous"
          du -sh site
        working-directory: OOPS/prosperous

      - uses: actions/upload-pages-artifact@v3
        with:
          path: OOPS/prosperous/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
