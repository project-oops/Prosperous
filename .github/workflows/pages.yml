name: Deploy landing page to GitHub Pages

# Publishes frontend/web/ to Pages on every push to main.
#
# `configure-pages` is asked to enable Pages itself, so a fresh clone of this
# repository does not need somebody to visit Settings first - the one manual
# step that is invisible until the deploy fails.

on:
  push:
    branches: [main]
    paths:
      - "frontend/web/**"
      - "assets/logo.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site bundle
    # GitHub Pages does not serve a private repository on a free plan, and turning this
    # repository private turned Pages off with it. Without this guard the workflow would fail on
    # every push - a red mark that means nothing except that the site is deliberately not there.
    # Gated rather than deleted: flip the repository back to public and the site returns.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      # The standard OOPS preamble, the same three steps every workflow in the
      # collection begins with: the collection, this repository *into* it, then the
      # siblings this project needs. See docs/BUILDING.md.
      #
      # The docs render needs no build, so nothing here would fail without the layout
      # today. It is the same shape anyway: orbistoun's Pages job *does* build rustdoc,
      # it was the one workflow left on a flat checkout, and it broke the moment that
      # project grew a path dependency. One shape means that cannot happen twice.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OOPS
          path: OOPS
      - uses: actions/checkout@v4
        with:
          path: OOPS/prosperous

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Siblings this build needs
        run: OOPS/bin/oops bootstrap prosperous

      - name: Assemble bundle
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp -r frontend/web/. site/
          cp assets/logo.svg site/assets/
          bash ../tools/build-docs.sh . site "#4da6ff" "Prosperous"
          du -sh site
        working-directory: OOPS/prosperous

      - uses: actions/upload-pages-artifact@v3
        with:
          path: OOPS/prosperous/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
