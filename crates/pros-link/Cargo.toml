[package]
name = "pros-link"
version = "0.1.0"
description = "Transport for the services a prepared target target runs"
edition.workspace = true
license.workspace = true
publish.workspace = true

# One dependency, justified individually because obSCEne keeps a deliberate dependency list.
# `tracing` gives the transport wire-level diagnostics. In obSCEne's tree it costs four
# packages and no proc-macro: `attributes` (`#[instrument]`, unused here) stays off because it
# pulls a proc-macro chain and a second `syn`. A consumer can compile every call out with
# `tracing/max_level_off`. (D025)
#
# Anything else that needs a dependency (hashing, manifests) lives in `pros-core`. See
# docs/DESIGN.md.
[dependencies]
tracing = { workspace = true }

[lints]
workspace = true
