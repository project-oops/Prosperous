[package]
name = "pros-core"
version = "0.1.0"
description = "Registry, payload manifest and workflows over the target transport"
edition.workspace = true
license.workspace = true
publish.workspace = true

# This crate is the layer that takes dependencies. `pros-link` keeps its table empty because
# obSCEne depends on it and holds a short dependency list; each entry here is justified below.
[dependencies]
# The transport. This crate decides about a target; only `pros-link` speaks to one.
pros-link = { workspace = true }

# The payload repository is JSON written by a tool this project does not control; escapes and
# encodings are where a hand-rolled reader misreads a checksum field.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging facade: this crate never writes to the terminal, the binary decides where
# `tracing` output goes.
tracing = { workspace = true }

# Which build this is, and where this machine lets us write.
oops-build = { workspace = true }
oops-paths = { workspace = true }

# Verifying a download before it runs on the target with elevated privileges.
sha2 = "0.10"

# The `param.sfo` reader. A platform format belongs in SELFish, so `sfo` here is only the
# in-place writer and the account rendering built over it. (D028)
selfish-title = { workspace = true }
# For `Generation::from_container_magic`: recognising a SELF container from its first four
# bytes, so a transfer knows the target unwraps it on store and its size changes.
selfish-abi = { workspace = true }

[build-dependencies]
# `emit` runs at build time, `stamp!` at run time.
oops-build = { workspace = true }

[lints]
workspace = true
