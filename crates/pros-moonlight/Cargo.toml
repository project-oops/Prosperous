[package]
name = "pros-moonlight"
version = "0.1.0"
description = "A Moonlight/GameStream host bridge in front of Porthole's two ports"
edition.workspace = true
license.workspace = true
publish.workspace = true

# A separate crate so its TLS, crypto, FEC, ENet and mDNS dependencies stay out of `pros-link`
# (D025) and `pros-core`, which obSCEne and orbistoun depend on. Only the shims depend on it.
# The crate choices follow `moonshine` (BSD-2-Clause); see `ACKNOWLEDGEMENTS.md`.
[dependencies]
pros-link = { workspace = true }
tracing = { workspace = true }

# Pairing crypto, pinned as one compatible RustCrypto set: `rsa` 0.9 carries `digest` 0.10 and
# `rand_core` 0.6, so `sha2` is 0.10 and `rand` is 0.8, or the `Digest`/`CryptoRng` bounds do not
# line up.
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"
aes = "0.8"
rand = "0.8"
hex = "0.4"
# The self-signed server certificate the client pins (`builder`), and parsing the client's (`pem`).
x509-cert = { version = "0.2", features = ["builder", "pem"] }

# Advertises `_nvstream._tcp`, so a client finds the bridge without being given its address.
mdns-sd = "0.21"
# The HTTPS port (47984). The `ring` provider builds without cmake or nasm; GameStream speaks
# TLS 1.2.
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# The stream: `rtsp-types` for the session handshake, `fec-rs` for the Reed-Solomon FEC on the
# video, `aes-gcm` and `rusty_enet` for the encrypted control channel that carries input.
# `aes-gcm` 0.10 shares one `aes`/`cipher` version with the pairing crypto.
rtsp-types = "0.1.3"
fec-rs = "0.1.0"
aes-gcm = "0.10"
rusty_enet = "0.4.0"

[lints]
workspace = true
